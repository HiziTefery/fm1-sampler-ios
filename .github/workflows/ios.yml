# Builds the iOS app (no signing) and runs the host tests of the engine, so the port stays buildable without a Mac at hand.
name: iOS
on:
  push:
    paths: ['engine/**', 'ios/**', 'samples/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['engine/**', 'ios/**', 'samples/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel   # the arm64 Mac runners are short of capacity (jobs time out in the queue)
    steps:
      - uses: actions/checkout@v4
      - name: Host tests of the engine glue
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/fm1-sampler"
          make -C engine -j4
          make -C engine "$PWD/engine/build/test_host"
          engine/build/test_host
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          cd ios
          xcodebuild -project FM1Sampler.xcodeproj -scheme FM1Sampler -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 \
            || { grep -n -B2 -A8 'error:' sim.log | head -n 200; tail -n 15 sim.log; exit 1; }
          tail -n 3 sim.log
      - name: Build for the device (unsigned)
        run: |
          cd ios
          xcodebuild -project FM1Sampler.xcodeproj -scheme FM1Sampler -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > device.log 2>&1 \
            || { grep -n -B2 -A8 'error:' device.log | head -n 200; tail -n 15 device.log; exit 1; }
          tail -n 3 device.log
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/FM1Sampler.app Payload/
          zip -qry FM1Sampler-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FM1Sampler-unsigned-ipa
          path: ios/FM1Sampler-unsigned.ipa
      # The app really starts: it must still be alive after 20 s, and a screenshot of what it draws is kept.
      - name: Run in the simulator
        run: |
          cd ios
          ID=$(xcrun simctl create fm1 "iPhone 16")
          xcrun simctl boot "$ID"
          xcrun simctl bootstatus "$ID" -b | tail -n 2
          xcrun simctl install "$ID" build-sim/Build/Products/Debug-iphonesimulator/FM1Sampler.app
          xcrun simctl privacy "$ID" grant microphone com.ferluht.fm1sampler
          xcrun simctl launch "$ID" com.ferluht.fm1sampler
          sleep 20
          xcrun simctl io "$ID" screenshot simulator.png
          xcrun simctl spawn "$ID" log show --last 2m --style compact --predicate 'process == "FM1Sampler"' | grep -i "fm1sampler:\|crash\|exception" | tail -n 40 || true
          xcrun simctl spawn "$ID" launchctl list | grep com.ferluht.fm1sampler
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: ios/simulator.png
